services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: securepassword123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d marketplace_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./media:/app/media
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: securepassword123
      DB_HOST: db
      DJANGO_SECRET_KEY: dev-insecure-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword123
    ports:
      - "5051:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
