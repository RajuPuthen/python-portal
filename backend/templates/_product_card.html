<div class="overflow-hidden rounded-2xl border border-stone-200 bg-white shadow-sm">
    <img class="h-48 w-full object-cover" src="{{ product.image.url }}" alt="{{ product.name }}">
    <div class="space-y-2 p-4">
        <h3 class="font-display text-lg font-semibold">{{ product.name }}</h3>
        <p class="text-lg font-medium text-ember">${{ product.price }}</p>
        {% if show_seller %}
            <p class="text-sm text-stone-500">
                Sold by
                <a class="font-medium text-ink underline decoration-stone-300 underline-offset-2 hover:text-ember" href="{% url 'client_catalog' product.client.slug %}">
                    {{ product.client.name }}
                </a>
            </p>
        {% endif %}
        {% if show_status %}
            {% if product.status == 'PENDING' %}
                <span class="inline-flex rounded-full bg-amber-100 px-2.5 py-1 text-xs font-semibold uppercase tracking-wide text-amber-800">Pending</span>
            {% elif product.status == 'APPROVED' %}
                <span class="inline-flex rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-semibold uppercase tracking-wide text-emerald-800">Approved</span>
            {% else %}
                <span class="inline-flex rounded-full bg-rose-100 px-2.5 py-1 text-xs font-semibold uppercase tracking-wide text-rose-800">Rejected</span>
            {% endif %}
        {% endif %}
    </div>
</div>
